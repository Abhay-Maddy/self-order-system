services:
  - type: web
    name: aamantran-backend
    env: node
    buildCommand: npm install && npm run build && npm rebuild sqlite3 --build-from-source
    startCommand: node start.js
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: abhaymddy@aamantran.com
      - key: ADMIN_PASSWORD
        value: admin123
      - key: PAYMENT_UPI_ID
        value: abhaymaddheshiya@axl
      - key: PAYMENT_MERCHANT_NAME
        value: Aamantran Restaurant
      - key: NODE_ENV
        value: production
